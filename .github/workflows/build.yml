name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: encode-apps-windows-amd64.exe
            sep: ";"
          - os: ubuntu-latest
            artifact_name: encode-apps-linux-amd64
            sep: ":"
          - os: macos-latest
            artifact_name: encode-apps-macos-arm64
            sep: ":"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "${{ matrix.artifact_name }}" `
            --add-data "src/encode_apps/resources/Ani-One_ID_-_Template.ass${{ matrix.sep }}encode_apps/resources" `
            src/encode_apps/__main__.py

      - name: Build executable with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller \
            --noconfirm \
            --onefile \
            --windowed \
            --name "${{ matrix.artifact_name }}" \
            --add-data "src/encode_apps/resources/Ani-One_ID_-_Template.ass${{ matrix.sep }}encode_apps/resources" \
            src/encode_apps/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release/
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
