[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encode-apps"
version = "1.0.5"
description = "Cross-platform GUI hardsub encoder — burn-in ASS/SRT subtitles with ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pysubs2>=1.7",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
encode-apps = "encode_apps.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/encode_apps"]
